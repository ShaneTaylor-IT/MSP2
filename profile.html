<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chore Manager - Profile</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <link rel="manifest" href="assets/images/site.webmanifest">

    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>

</head>

<body>
    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg fixed-top bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="home.html"><img id="logo" src="assets/images/logo.png"
                    alt="Chore Manager Logo"></a> <!-- Logo will go here -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link fs-3" href="home.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fs-3" href="members.html">Members</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fs-3" href="schedule.html">Schedule</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fs-3" href="add-chore.html">Add Chore</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fs-3 active fw-bold" aria-current="page" href="profile.html">Profile</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="d-flex flex-column min-vh-100">
        <div class="container app-section">
            <div class="row">
                <div class="col-12">
                    <h1>Create or edit profile</h1>
                    <p>This will be how other members see your profile.</p>
                </div>
            </div>
        </div>
        <div class="container app-section">
            <div class="row">
                <div class="col-12">
                    <form>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Your avatar</label>
                            <div class="d-flex gap-2">
                                <div class="avatar-option app-avatar bg-primary rounded-circle" data-color="blue">Blue</div>
                                <div class="avatar-option app-avatar bg-warning rounded-circle" data-color="yellow">Yellow</div>
                                <div class="avatar-option app-avatar bg-success rounded-circle" data-color="green">Green</div>
                                <div class="avatar-option app-avatar bg-info rounded-circle" data-color="lightblue">Cyan</div>
                                <div class="avatar-option app-avatar bg-danger rounded-circle" data-color="red">Red</div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastName">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Display Name</label>
                            <input type="text" class="form-control" id="displayName">
                        </div>
                        <div class="d-flex gap-3 mb-4">
                            <button class="btn app-btn w-100" type="button">Create new household</button>
                            <button class="btn app-btn w-100" type="button">Add member</button>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Household</label>
                            <input type="text" class="form-control" id="householdName">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Your role</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="role" id="adminRole" value="admin">
                                <label class="form-check-label" for="adminRole">Household Admin</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="role" id="guestRole" value="guest">
                                <label class="form-check-label" for="guestRole">Household Guest</label>
                            </div>
                        </div>
                        <div class="d-flex gap-3 mt-4">
                            <button type="button" class="btn app-btn w-50" id="cancelBtn">Cancel</button>
                            <button type="submit" class="btn app-btn w-50" id="confirmBtn">Confirm</button>
                        </div>
                    </form>
                    <div class="text-center mt-5">
                        <div id="avatarPreview"
                            class="rounded-circle d-inline-flex justify-content-center align-items-center"
                            style="width: 80px; height: 80px; font-size: 2rem; background-color: #e0e0e0; color: #fff;">
                            ?
                        </div>

                        <h2 class="mt-3" id="welcomeName">Welcome, user!</h2>
                        <p>Welcome to Chore Manager. Set up your household to begin organising chores.</p>

                        <button class="btn app-btn mt-3">Get Started</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto">
        <div class="container text-center py-3">
            <p class="mb-0">&copy; 2026 Chore Manager. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Font Awesome icons -->
    <script src="https://kit.fontawesome.com/57eeae5219.js" crossorigin="anonymous"></script>

    <!-- Custom JS -->
    <script src="assets/js/profile.js"></script>
</body>

</html>
