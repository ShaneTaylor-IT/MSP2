    <main class="d-flex flex-column min-vh-100">
        <div class="container my-5">
            <div class="row">
                <section class="mb-4 app-section">
                    <h1>Add a Chore</h1>
                    <p>Complete the form below to add a new chore to your household schedule.</p>
                </section>

                <section class="mb-4 app-section">
                    <h3>Quick Templates</h3>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-outline-secondary template-btn"
                            data-template="hoover">Hoover rooms</button>
                        <button type="button" class="btn btn-outline-secondary template-btn" data-template="laundry">Do
                            laundry</button>
                        <button type="button" class="btn btn-outline-secondary template-btn" data-template="grass">Cut
                            the grass</button>
                        <button type="button" class="btn btn-outline-secondary template-btn"
                            data-template="bathroom">Clean the bathroom</button>
                        <button type="button" class="btn btn-outline-secondary template-btn"
                            data-template="shopping">Weekly shopping</button>
                        <button type="button" class="btn btn-outline-secondary template-btn" data-template="mop">Mop
                            floors</button>
                    </div>
                </section>

                <section class="mb-5 app-section">
                    <form id="addChoreForm">

                        <div class="mb-3">
                            <label class="form-label">Chore Title</label>
                            <input type="text" class="form-control" id="choreTitle">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Assign To</label>
                            <div class="d-flex gap-2" id="assignTo">
                            </div>
                        </div>

                        <div class="mb-3" id="prioritySection">
                            <label class="form-label">Priority</label>
                            <div class="d-flex gap-3">
                                <label><input type="radio" name="priority" value="low"> Low</label>
                                <label><input type="radio" name="priority" value="medium"> Medium</label>
                                <label><input type="radio" name="priority" value="high"> High</label>
                            </div>
                        </div>

                        <div class="mb-3" id="recurrenceSection">
                            <label class="form-label">Recurrence</label>
                            <div class="d-flex flex-wrap gap-3">
                                <label><input type="radio" name="recurrence" value="once"> Once</label>
                                <label><input type="radio" name="recurrence" value="daily"> Daily</label>
                                <label><input type="radio" name="recurrence" value="weekly"> Weekly</label>
                                <label><input type="radio" name="recurrence" value="monthly"> Monthly</label>
                                <label><input type="radio" name="recurrence" value="fortnightly"> Fortnightly</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Day</label>
                            <div class="d-flex flex-wrap gap-2" id="choreDay">
                                <button type="button" class="day-select" data-day="monday">Mon</button>
                                <button type="button" class="day-select" data-day="tuesday">Tue</button>
                                <button type="button" class="day-select" data-day="wednesday">Wed</button>
                                <button type="button" class="day-select" data-day="thursday">Thu</button>
                                <button type="button" class="day-select" data-day="friday">Fri</button>
                                <button type="button" class="day-select" data-day="saturday">Sat</button>
                                <button type="button" class="day-select" data-day="sunday">Sun</button>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Start Time</label>
                            <input type="time" class="form-control" id="choreTime">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Duration (minutes)</label>
                            <select class="form-select" id="choreDuration">
                                <option value="15">15 min</option>
                                <option value="30">30 min</option>
                                <option value="45">45 min</option>
                                <option value="60">60 min</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Notes</label>
                            <textarea class="form-control" id="choreNotes" rows="3"></textarea>
                        </div>

                        <div class="d-flex gap-3 mt-4">
                            <button type="button" class="btn app-btn w-50" id="cancelChoreBtn">Cancel</button>
                            <button type="submit" class="btn app-btn w-50" id="confirmChoreBtn">Confirm</button>
                        </div>

                    </form>
                </section>

                <section class="mb-5 app-section">
                    <div class="card app-card p-3" id="chorePreview">
                        <h4>Chore Preview</h4>
                        <p>Your chore details will appear here once completed.</p>
                    </div>
                </section>
            </div>
        </div>
    </main>
