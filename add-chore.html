        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

        <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <link rel="manifest" href="assets/images/site.webmanifest">

</head>

<body>
    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg fixed-top bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="home.html"><img id="logo" src="assets/images/logo.png" alt="Chore Manager Logo"></a> <!-- Logo will go here -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="home.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="members.html">Members</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="schedule.html">Schedule</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="add-chore.html">Add Chore</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">Profile</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main content -->
     <main class="container my-5">

    <!-- Page Title -->
    <section class="mb-4">
        <h1>Add a Chore</h1>
        <p>Complete the form below to add a new chore to your household schedule.</p>
    </section>

    <!-- Quick Templates -->
    <section class="mb-4">
        <h3>Quick Templates</h3>
        <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn btn-outline-secondary template-btn" data-template="hoover">Hoover rooms</button>
            <button type="button" class="btn btn-outline-secondary template-btn" data-template="laundry">Do laundry</button>
            <button type="button" class="btn btn-outline-secondary template-btn" data-template="grass">Cut the grass</button>
            <button type="button" class="btn btn-outline-secondary template-btn" data-template="bathroom">Clean the bathroom</button>
            <button type="button" class="btn btn-outline-secondary template-btn" data-template="shopping">Weekly shopping</button>
            <button type="button" class="btn btn-outline-secondary template-btn" data-template="mop">Mop floors</button>
        </div>
    </section>

    <!-- Chore Form -->
    <section class="mb-5">
        <form id="addChoreForm">

            <!-- Chore Title -->
            <div class="mb-3">
                <label class="form-label">Chore Title</label>
                <input type="text" class="form-control" id="choreTitle">
            </div>

            <!-- Assign To -->
            <div class="mb-3">
                <label class="form-label">Assign To</label>
                <div class="d-flex gap-2" id="assignTo">
                    <!-- Example member bubbles -->
                    <button type="button" class="member-select rounded-circle" data-member="ST">ST</button>
                    <button type="button" class="member-select rounded-circle" data-member="JB">JB</button>
                    <button type="button" class="member-select rounded-circle" data-member="BS">BS</button>
                </div>
            </div>

            <!-- Priority -->
            <div class="mb-3">
                <label class="form-label">Priority</label>
                <div class="d-flex gap-3">
                    <label><input type="radio" name="priority" value="low"> Low</label>
                    <label><input type="radio" name="priority" value="medium"> Medium</label>
                    <label><input type="radio" name="priority" value="high"> High</label>
                </div>
            </div>

            <!-- Recurrence -->
            <div class="mb-3">
                <label class="form-label">Recurrence</label>
                <div class="d-flex flex-wrap gap-3">
                    <label><input type="radio" name="recurrence" value="once"> Once</label>
                    <label><input type="radio" name="recurrence" value="daily"> Daily</label>
                    <label><input type="radio" name="recurrence" value="weekly"> Weekly</label>
                    <label><input type="radio" name="recurrence" value="monthly"> Monthly</label>
                    <label><input type="radio" name="recurrence" value="fortnightly"> Fortnightly</label>
                </div>
            </div>

            <!-- Day -->
            <div class="mb-3">
                <label class="form-label">Day</label>
                <div class="d-flex flex-wrap gap-2" id="choreDay">
                    <button type="button" class="day-select" data-day="monday">Mon</button>
                    <button type="button" class="day-select" data-day="tuesday">Tue</button>
                    <button type="button" class="day-select" data-day="wednesday">Wed</button>
                    <button type="button" class="day-select" data-day="thursday">Thu</button>
                    <button type="button" class="day-select" data-day="friday">Fri</button>
                    <button type="button" class="day-select" data-day="saturday">Sat</button>
                    <button type="button" class="day-select" data-day="sunday">Sun</button>
                </div>
            </div>

            <!-- Time -->
            <div class="mb-3">
                <label class="form-label">Start Time</label>
                <input type="time" class="form-control" id="choreTime">
            </div>

            <!-- Duration -->
            <div class="mb-3">
                <label class="form-label">Duration (minutes)</label>
                <select class="form-select" id="choreDuration">
                    <option value="15">15 min</option>
                    <option value="30">30 min</option>
                    <option value="45">45 min</option>
                    <option value="60">60 min</option>
                </select>
            </div>

            <!-- Notes -->
            <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea class="form-control" id="choreNotes" rows="3"></textarea>
            </div>

            <!-- Buttons -->
            <div class="d-flex gap-3 mt-4">
                <button type="button" class="btn btn-outline-danger w-50">Cancel</button>
                <button type="submit" class="btn btn-success w-50" id="confirmChoreBtn">Confirm</button>
            </div>

        </form>
    </section>

    <!-- Chore Preview -->
    <section class="mb-5">
        <div class="card p-3" id="chorePreview">
            <h4>Chore Preview</h4>
            <p class="text-muted">Your chore details will appear here once completed.</p>
        </div>
    </section>

</main>


    <!-- Footer -->
    <footer class="mt-auto">
        <div class="container text-center py-3">
            <p class="mb-0">&copy; 2026 Chore Manager. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Font Awesome icons -->
    <script src="https://kit.fontawesome.com/57eeae5219.js" crossorigin="anonymous"></script>

    <!-- JS script provided by CodeInstitute for collapsing nav bar on smaller screens when using Bootstrap-->
    <script>
        document
            .querySelectorAll(".navbar-collapse .nav-link")
            .forEach((link) => {
                link.addEventListener("click", function (e) {
                    let section = document.querySelector(e.target.getAttribute("href"));
                    if (section) {
                        e.preventDefault(); // Prevent default anchor click behavior
                        let navbarHeight = document.querySelector(".navbar-toggler").offsetHeight;
                        window.scroll({
                            top: section.offsetTop - navbarHeight, // Adjust for navbar height
                            behavior: "smooth",
                        });
                        document
                            .querySelector(".navbar-collapse")
                            .classList.remove("show"); // Collapse navbar
                    }
                });
            });
    </script>

    <!-- Custom JS -->
    <script src="assets/js/add-chore.js"></script>
</body>

</html>
